

[flake8]
max-line-length = 120
extend-ignore = E203, E501, E266, E402
#E501 line-length by Black
#E266 double ## in comments
max-complexity = 10
#https://en.wikipedia.org/wiki/Cyclomatic_complexity

# exclude certain files
# exclude = <file> or <folder>, <file> or <folder>


# NOTE: pytest config lives in pyproject.toml; flake8 cannot read pyproject.toml,
# so this file is kept for flake8 only.
