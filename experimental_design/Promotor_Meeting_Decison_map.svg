<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 866" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#1e3a8a"/></marker></defs><rect x="0" y="0" width="1400" height="866" fill="#ffffff"/><rect x="28" y="20" width="1344" height="70" rx="10" fill="#1e3a8a"/><text x="50" y="52" fill="#ffffff" font-size="24" font-weight="700">Instrumented Imitation Learning — Decision Map</text><text x="50" y="76" fill="#c7d2fe" font-size="14.5">Hypothesis: supervising an encoder with task instrumentation (privileged, training-only) yields better data efficiency than random or generic pretraining.</text><text x="28" y="118" fill="#1e3a8a" font-size="15" font-weight="700">EXPERIMENT PIPELINE</text><rect x="28" y="130" width="204" height="214" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M28,160 L28,139 Q28,130 37,130 L223,130 Q232,130 232,139 L232,160 Z" fill="#0f766e"/><text x="40" y="151" fill="#ffffff" font-size="14.5" font-weight="700">1  Collect data</text><text x="40" y="180" fill="#1f2937" font-size="12.7">• Teleop, all tasks</text><text x="40" y="197.5" fill="#1f2937" font-size="12.7">• + real-time visual force</text><text x="40" y="215" fill="#1f2937" font-size="12.7">   feedback</text><text x="40" y="232.5" fill="#1f2937" font-size="12.7">• Iterative: batches of 20</text><text x="40" y="250" fill="#1f2937" font-size="12.7">• Stop at 90% or plateau;</text><text x="40" y="267.5" fill="#1f2937" font-size="12.7">   cap 100</text><text x="40" y="285" fill="#1f2937" font-size="12.7">• Successful demos only</text><line x1="234" y1="237" x2="254" y2="237" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arw)"/><rect x="256" y="130" width="204" height="214" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M256,160 L256,139 Q256,130 265,130 L451,130 Q460,130 460,139 L460,160 Z" fill="#0f766e"/><text x="268" y="151" fill="#ffffff" font-size="14.5" font-weight="700">2  Reduce data</text><text x="268" y="180" fill="#1f2937" font-size="12.7">• First-N prefix (uniform)</text><text x="268" y="197.5" fill="#1f2937" font-size="12.7">• 100 / 75 / 50 / 25%</text><text x="268" y="215" fill="#1f2937" font-size="12.7">• Assume episodes i.i.d.</text><line x1="462" y1="237" x2="482" y2="237" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arw)"/><rect x="484" y="130" width="204" height="214" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M484,160 L484,139 Q484,130 493,130 L679,130 Q688,130 688,139 L688,160 Z" fill="#7c3aed"/><text x="496" y="151" fill="#ffffff" font-size="14.5" font-weight="700">3  Suitability test</text><text x="496" y="180" fill="#1f2937" font-size="12.7">• Pretrain image vs audio</text><text x="496" y="197.5" fill="#1f2937" font-size="12.7">• to predict instrumentation</text><text x="496" y="215" fill="#1f2937" font-size="12.7">• Pick higher val score</text><text x="496" y="232.5" fill="#1f2937" font-size="12.7">• = picks the modality</text><line x1="690" y1="237" x2="710" y2="237" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arw)"/><rect x="712" y="130" width="204" height="214" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M712,160 L712,139 Q712,130 721,130 L907,130 Q916,130 916,139 L916,160 Z" fill="#2563eb"/><text x="724" y="151" fill="#ffffff" font-size="14.5" font-weight="700">4  Three variants (init)</text><text x="724" y="180" fill="#1f2937" font-size="12.7">• From scratch (random)</text><text x="724" y="197.5" fill="#1f2937" font-size="12.7">• Instrumentation-pretrained</text><text x="724" y="215" fill="#1f2937" font-size="12.7">• Generic (ImageNet /</text><text x="724" y="232.5" fill="#1f2937" font-size="12.7">   AudioSet)</text><text x="724" y="250" fill="#1f2937" font-size="12.7">• All encoders fine-tuned</text><text x="724" y="267.5" fill="#1f2937" font-size="12.7">• Same reduced subset</text><line x1="918" y1="237" x2="938" y2="237" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arw)"/><rect x="940" y="130" width="204" height="214" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M940,160 L940,139 Q940,130 949,130 L1135,130 Q1144,130 1144,139 L1144,160 Z" fill="#2563eb"/><text x="952" y="151" fill="#ffffff" font-size="14.5" font-weight="700">5  Train policy</text><text x="952" y="180" fill="#1f2937" font-size="12.7">• Diffusion Policy (lerobot)</text><text x="952" y="197.5" fill="#1f2937" font-size="12.7">• Fixed step budget (~100k)</text><text x="952" y="215" fill="#1f2937" font-size="12.7">• Select by rollout success,</text><text x="952" y="232.5" fill="#1f2937" font-size="12.7">• NOT training loss</text><line x1="1146" y1="237" x2="1166" y2="237" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arw)"/><rect x="1168" y="130" width="204" height="214" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M1168,160 L1168,139 Q1168,130 1177,130 L1363,130 Q1372,130 1372,139 L1372,160 Z" fill="#1e3a8a"/><text x="1180" y="151" fill="#ffffff" font-size="14.5" font-weight="700">6  Evaluate</text><text x="1180" y="180" fill="#1f2937" font-size="12.7">• 20 real rollouts / config</text><text x="1180" y="197.5" fill="#1f2937" font-size="12.7">• Success rate = primary</text><text x="1180" y="215" fill="#1f2937" font-size="12.7">• Binomial CI + Fisher test</text><text x="28" y="372" fill="#1e3a8a" font-size="15" font-weight="700">TASKS &amp; INSTRUMENTATION</text><text x="298" y="372" fill="#6b7280" font-size="12.7">Order 1→2→3 first (single-arm) · instrumentation doubles as the success signal</text><rect x="28" y="386" width="322.5" height="176" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M28,416 L28,395 Q28,386 37,386 L341.5,386 Q350.5,386 350.5,395 L350.5,416 Z" fill="#1d4ed8"/><text x="40" y="407" fill="#ffffff" font-size="14.5" font-weight="700">1. Rubber plugs</text><text x="40" y="436" fill="#1f2937" font-size="12.7">• Arms: 1</text><text x="40" y="453.5" fill="#1f2937" font-size="12.7">• Sensor: circuit closer (binary)</text><text x="40" y="471" fill="#1f2937" font-size="12.7">• Modality (hyp.): audio</text><text x="40" y="488.5" fill="#1f2937" font-size="12.7">• Success: circuit closed</text><rect x="368.5" y="386" width="322.5" height="176" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M368.5,416 L368.5,395 Q368.5,386 377.5,386 L682,386 Q691,386 691,395 L691,416 Z" fill="#1d4ed8"/><text x="380.5" y="407" fill="#ffffff" font-size="14.5" font-weight="700">2. Bottle opening</text><text x="380.5" y="436" fill="#1f2937" font-size="12.7">• Arms: 1</text><text x="380.5" y="453.5" fill="#1f2937" font-size="12.7">• Sensor: LDR in cap (continuous)</text><text x="380.5" y="471" fill="#1f2937" font-size="12.7">• Modality (hyp.): image</text><text x="380.5" y="488.5" fill="#1f2937" font-size="12.7">• Success: LDR &gt; threshold</text><rect x="709" y="386" width="322.5" height="176" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/><path d="M709,416 L709,395 Q709,386 718,386 L1022.5,386 Q1031.5,386 1031.5,395 L1031.5,416 Z" fill="#1d4ed8"/><text x="721" y="407" fill="#ffffff" font-size="14.5" font-weight="700">3. Disk wiping</text><text x="721" y="436" fill="#1f2937" font-size="12.7">• Arms: 1</text><text x="721" y="453.5" fill="#1f2937" font-size="12.7">• Sensor: load cell (continuous)</text><text x="721" y="471" fill="#1f2937" font-size="12.7">• Modality (hyp.): audio</text><text x="721" y="488.5" fill="#1f2937" font-size="12.7">• Success: force in range</text><rect x="1049.5" y="386" width="322.5" height="176" rx="9" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3"/><path d="M1049.5,416 L1049.5,395 Q1049.5,386 1058.5,386 L1363,386 Q1372,386 1372,395 L1372,416 Z" fill="#6b7280"/><text x="1061.5" y="407" fill="#ffffff" font-size="14.5" font-weight="700">4. Ziplock bag</text><text x="1061.5" y="436" fill="#1f2937" font-size="12.7">• Arms: 2 — bimanual</text><text x="1061.5" y="453.5" fill="#1f2937" font-size="12.7">• DEFERRED (if time allows)</text><text x="1061.5" y="471" fill="#1f2937" font-size="12.7">• Sensor: TBD · Modality: image</text><text x="1061.5" y="488.5" fill="#1f2937" font-size="12.7">• Success: slider fully open</text><rect x="28" y="588" width="1344" height="254" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><rect x="28" y="588" width="1344" height="30" rx="10" fill="#f59e0b"/><text x="42" y="609" fill="#fff" font-size="14.5" font-weight="700">OPEN QUESTIONS FOR PROMOTOR  (report §8)</text><text x="44" y="640" fill="#b45309" font-size="13.3" font-weight="700">1. Ziplock sensor</text><text x="58" y="658" fill="#4b5563" font-size="12.6">Hall-effect + magnet? string pot? — decide the</text><text x="58" y="675" fill="#4b5563" font-size="12.6">instrumentation.</text><text x="44" y="700" fill="#b45309" font-size="13.3" font-weight="700">2. Wiping validity</text><text x="58" y="718" fill="#4b5563" font-size="12.6">Can audio disambiguate look-alike materials? Is there a</text><text x="58" y="735" fill="#4b5563" font-size="12.6">real, narrow force tolerance (else task too easy)?</text><text x="44" y="760" fill="#b45309" font-size="13.3" font-weight="700">3. Generalization claim</text><text x="58" y="778" fill="#4b5563" font-size="12.6">Within-task data efficiency only, or add cross-condition</text><text x="58" y="795" fill="#4b5563" font-size="12.6">generalization?</text><text x="710" y="640" fill="#b45309" font-size="13.3" font-weight="700">4. Demonstrations</text><text x="724" y="658" fill="#4b5563" font-size="12.6">Confirm teleoperation for ALL tasks (no scripting, to avoid</text><text x="724" y="675" fill="#4b5563" font-size="12.6">confound).</text><text x="710" y="700" fill="#b45309" font-size="13.3" font-weight="700">5. Training duration</text><text x="724" y="718" fill="#4b5563" font-size="12.6">Fixed step budget + select by rollout success — align with</text><text x="724" y="735" fill="#4b5563" font-size="12.6">senior (vs 0.001-loss idea).</text></svg>